name: Release APK

# 仅手动触发。正式发布（Release 附件）由本地签名构建后上传，
# CI 无正式签名密钥，此前打 tag 自动把 debug 签名的包挂到 Release，
# 会导致用户装上后无法被正式版覆盖升级，故移除 push tags 触发。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/feiniu-album-tv-${VERSION}-debug-ci.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: feiniu-album-tv-apk
          path: dist/*.apk
          if-no-files-found: error
